name: Build, attest, and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
    # Only prose that no build or test consumes may skip the pipeline. Deliberately absent:
    # README.md and CHANGELOG.md are read by the hygiene and release-note contracts, while
    # LICENSE and THIRD_PARTY_NOTICES.md are packaged into META-INF/veloauth and therefore
    # change the artifact bytes. Editing any of those must still run the full matrix.
    paths-ignore:
      - '2FA.md'
      - 'docs/**'
      - '.github/skills/**'
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the exact pull-request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject vulnerable runtime dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime

  dependency-inventory:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.project-version.outputs.version }}
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Temurin 21.0.12+8 for dependency resolution
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.12'
          show-download-progress: true

      - name: Resolve and verify the complete Maven production inventory
        run: |
          ./mvnw -B -V clean package -DskipTests
          ./scripts/test-dependency-hygiene.sh

      # Derived from the POM so a version bump cannot silently desynchronise the
      # OSV inventory artifact from the packaged SBOM.
      - name: Resolve the project version
        id: project-version
        run: ./scripts/print-project-version.sh >>"${GITHUB_OUTPUT}"

      - name: Upload the same-run OSV inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veloauth-osv-input-${{ github.sha }}
          path: target/veloauth-${{ steps.project-version.outputs.version }}.cdx.json
          if-no-files-found: error
          overwrite: false
          retention-days: 5

  osv-scan:
    needs: dependency-inventory
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      download-artifact: veloauth-osv-input-${{ github.sha }}
      scan-args: |-
        --no-resolve
        --lockfile=pom.xml
        --lockfile=veloauth-${{ needs.dependency-inventory.outputs.version }}.cdx.json
      fail-on-vuln: true
      upload-sarif: true

  verify:
    if: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: veloauth_it
          POSTGRES_USER: veloauth_it
          POSTGRES_PASSWORD: veloauth_it_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veloauth_it -d veloauth_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: veloauth_it
          MYSQL_USER: veloauth_it
          MYSQL_PASSWORD: veloauth_it_password
          MYSQL_ROOT_PASSWORD: veloauth_it_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uveloauth_it -pveloauth_it_password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Temurin 25.0.4+7 for the Velocity-CTD proxy only
        id: verify-java25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          show-download-progress: true

      - name: Restore exact Temurin 21.0.12+8 as the build default
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.12'
          show-download-progress: true

      - name: Verify release and reproducibility fixtures
        run: |
          ./scripts/test-release-artifacts.sh
          ./scripts/test-verify-reproducible-jar.sh

      - name: Verify embedded dependency and offline protocol metadata fixtures
        run: |
          ./scripts/verify-embedded-dependencies.sh
          ./scripts/test-protocol-build-resolver.sh

      - name: Run the complete Maven quality gate
        run: ./mvnw -B -V clean verify pmd:cpd-check -DskipTests=false

      - name: Verify SBOM and shaded dependency inventory
        run: ./scripts/test-dependency-hygiene.sh

      - name: Prove the committed JAR is reproducible
        env:
          VELOAUTH_JAVA21_HOME: ${{ env.JAVA_HOME }}
        run: ./scripts/verify-reproducible-jar.sh

      - name: Smoke the pinned embedded topology on Velocity
        run: ./scripts/test-velocity-embedded.sh

      - name: Smoke modern forwarding on Velocity-CTD
        env:
          VELOAUTH_CTD_JAVA25_HOME: ${{ steps.verify-java25.outputs.path }}
          VELOAUTH_CTD_REQUIRE_PINNED_JAVA25: 'true'
        run: ./scripts/test-velocity-ctd-embedded.sh

      - name: Verify PostgreSQL behavior
        run: >-
          ./mvnw -B test
          -Dtest=PremiumUuidDaoPostgreSqlIT,JdbcAuthDaoDatabaseIT,DatabaseMigrationDatabaseIT
          -Dveloauth.postgres.url=jdbc:postgresql://127.0.0.1:5432/veloauth_it
          -Dveloauth.postgres.user=veloauth_it
          -Dveloauth.postgres.password=veloauth_it_password
          -Dveloauth.database.type=POSTGRESQL
          -Dveloauth.database.url=jdbc:postgresql://127.0.0.1:5432/veloauth_it?sslmode=disable
          -Dveloauth.database.user=veloauth_it
          -Dveloauth.database.password=veloauth_it_password

      - name: Verify MySQL behavior
        run: >-
          ./mvnw -B test
          -Dtest=JdbcAuthDaoDatabaseIT,DatabaseMigrationDatabaseIT
          -Dveloauth.database.type=MYSQL
          -Dveloauth.database.url='jdbc:mysql://127.0.0.1:3306/veloauth_it?useSSL=false&serverTimezone=UTC'
          -Dveloauth.database.user=veloauth_it
          -Dveloauth.database.password=veloauth_it_password

      # The rolling release must publish the exact bytes this job verified, so the JAR is
      # handed to the rolling job as an artifact instead of being rebuilt there.
      - name: Resolve the project version
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: project-version
        run: ./scripts/print-project-version.sh >>"${GITHUB_OUTPUT}"

      - name: Upload the verified rolling candidate
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veloauth-rolling-${{ github.sha }}
          path: target/veloauth-${{ steps.project-version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 5

  # Exactly one rolling release, updated in place. The release object and its tag name are
  # never recreated: the tag is repointed through the git ref API and the asset is replaced
  # with --clobber, so watchers are not notified again on every push. Publishing is gated on
  # the full verify matrix, so a red build can never reach the download link.
  rolling:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the verified rolling candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0
        with:
          name: veloauth-rolling-${{ github.sha }}
          path: rolling-candidate

      - name: Stage the rolling assets under a stable name
        id: assets
        run: |
          set -euo pipefail
          version="$(./scripts/print-project-version.sh)"
          version="${version#version=}"
          source_jar="rolling-candidate/veloauth-${version}.jar"
          [[ -f "${source_jar}" ]] || { echo "Verified rolling candidate is missing" >&2; exit 1; }
          mkdir -p rolling-assets
          # A stable file name keeps /releases/latest/download/veloauth-latest.jar permanent.
          cp -- "${source_jar}" rolling-assets/veloauth-latest.jar
          ( cd rolling-assets && sha256sum veloauth-latest.jar >veloauth-latest.jar.sha256 )
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "sha256=$(cut -d' ' -f1 <rolling-assets/veloauth-latest.jar.sha256)" >>"${GITHUB_OUTPUT}"

      - name: Repoint the rolling tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f "sha=${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/latest -f "sha=${GITHUB_SHA}" >/dev/null
          fi

      - name: Publish or update the single rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.assets.outputs.version }}
          SHA256: ${{ steps.assets.outputs.sha256 }}
          # Deliberately the commit-push timestamp from the event payload, not wall-clock:
          # the reproducibility fixtures forbid clock reads in this workflow, and the push
          # instant is the honest "how fresh is this build" signal anyway.
          PUSHED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/rolling-notes.md"
          # GitHub keeps showing the release's original creation date after in-place edits,
          # which reads as "no rollout happened". The title and notes therefore carry the
          # version, commit and push time of the build actually served right now.
          title="Rolling Latest Build — ${VERSION} @ ${GITHUB_SHA:0:7}"
          # Every line goes through a '%s\n' format string: a literal leading '-' would
          # otherwise be parsed as a printf option and abort the step.
          {
            printf '%s\n' 'Rolling build of `main`, published only after the full verify matrix passed.'
            printf '%s\n' ''
            printf '%s\n' "- Version: \`${VERSION}\`"
            printf '%s\n' "- Commit: ${GITHUB_SHA}"
            printf '%s\n' "- Source pushed at: ${PUSHED_AT}"
            printf '%s\n' "- SHA-256: \`${SHA256}\`"
            printf '%s\n' ''
            printf '%s\n' "Permanent download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/veloauth-latest.jar"
            printf '%s\n' ''
            printf '%s\n' 'This release is updated in place; the date GitHub shows next to it is when the'
            printf '%s\n' 'release object was first created, not when these assets were last replaced.'
            printf '%s\n' 'See CHANGELOG.md for released changes.'
          } >"${notes}"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "${title}" --notes-file "${notes}" \
              --prerelease=false --latest
            gh release upload latest \
              rolling-assets/veloauth-latest.jar \
              rolling-assets/veloauth-latest.jar.sha256 --clobber
          else
            gh release create latest --title "${title}" --notes-file "${notes}" \
              --prerelease=false --latest \
              rolling-assets/veloauth-latest.jar \
              rolling-assets/veloauth-latest.jar.sha256
          fi

      - name: Prove the release inventory is coherent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exactly one rolling release, and every other release is a versioned v* release.
          # The previous "Expected exactly one release" assertion predates the versioned
          # path coexisting with rolling and would fail every main push after the first tag.
          tags="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          rolling_count=0
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            if [[ "${tag}" == latest ]]; then
              rolling_count=$((rolling_count + 1))
            elif [[ ! "${tag}" =~ ^v[0-9] ]]; then
              echo "Unexpected release tag in inventory: ${tag}" >&2
              gh release list --limit 100 >&2
              exit 1
            fi
          done <<<"${tags}"
          if [[ "${rolling_count}" != 1 ]]; then
            echo "Expected exactly one release with the rolling tag, found ${rolling_count}" >&2
            gh release list --limit 100 >&2
            exit 1
          fi

  # Versioned, attested release path, reachable only by pushing a `v*` tag. Coexists with the
  # rolling job above: the rolling release owns the `latest` tag and the /releases/latest
  # download URL, so versioned releases publish with --latest=false and never touch the
  # `latest` tag. GitHub's immutable-releases repository setting stays OFF (rolling must
  # replace its assets in place); versioned releases are immutable in practice instead:
  # the release job refuses to mutate an existing release, this path never uses --clobber,
  # and the protected `v*` tag ruleset blocks tag rewrites.
  candidate:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
      jar-name: ${{ steps.identity.outputs.jar-name }}
      version: ${{ steps.identity.outputs.version }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: veloauth_it
          POSTGRES_USER: veloauth_it
          POSTGRES_PASSWORD: veloauth_it_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veloauth_it -d veloauth_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: veloauth_it
          MYSQL_USER: veloauth_it
          MYSQL_PASSWORD: veloauth_it_password
          MYSQL_ROOT_PASSWORD: veloauth_it_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uveloauth_it -pveloauth_it_password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout the immutable tag source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Temurin 25.0.4+7 for the Velocity-CTD proxy only
        id: candidate-java25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          show-download-progress: true

      - name: Restore exact Temurin 21.0.12+8 as the build default
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.12'
          show-download-progress: true

      - name: Bind tag, POM, and source commit
        id: identity
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ElementTree
          root = ElementTree.parse("pom.xml").getroot()
          namespace = root.tag.rpartition("}")[0] + "}" if "}" in root.tag else ""
          print((root.findtext(f"{namespace}version") or "").strip())
          PY
          )"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "POM does not contain a release version: ${version:-<empty>}" >&2
            exit 1
          fi
          expected_tag="v${version}"
          if [[ "${RELEASE_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag/POM mismatch: expected ${expected_tag}, found ${RELEASE_REF_NAME}" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_REF_NAME}"; then
            echo "Release tag is missing from the fetched repository" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" \
              || "$(git rev-parse "refs/tags/${RELEASE_REF_NAME}^{commit}")" != "${RELEASE_SHA}" ]]; then
            echo "Release tag, checkout, and workflow SHA must name the same commit" >&2
            exit 1
          fi
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"
          printf 'jar-name=veloauth-%s.jar\n' "${version}" >>"${GITHUB_OUTPUT}"
          printf 'artifact-name=veloauth-release-candidate-%s\n' "${RELEASE_SHA}" >>"${GITHUB_OUTPUT}"

      - name: Run release artifact fixture tests
        run: ./scripts/test-release-artifacts.sh

      - name: Run reproducibility fixture tests
        run: ./scripts/test-verify-reproducible-jar.sh

      - name: Build and smoke the single canonical candidate
        env:
          VELOAUTH_JAVA21_HOME: ${{ env.JAVA_HOME }}
          VELOAUTH_CTD_JAVA25_HOME: ${{ steps.candidate-java25.outputs.path }}
        run: |
          candidate_dir="${RUNNER_TEMP}/veloauth-release-candidate"
          mkdir -p "${candidate_dir}"
          ./scripts/verify-release-candidate.sh --build "${candidate_dir}"

      - name: Verify the canonical candidate dependency inventory
        env:
          JAR_NAME: ${{ steps.identity.outputs.jar-name }}
        run: >-
          ./scripts/test-dependency-hygiene.sh --jar-only
          "${RUNNER_TEMP}/veloauth-release-candidate/${JAR_NAME}"

      - name: Verify PostgreSQL without replacing the candidate JAR
        run: >-
          ./mvnw -B test
          -Dtest=PremiumUuidDaoPostgreSqlIT,JdbcAuthDaoDatabaseIT,DatabaseMigrationDatabaseIT
          -Dveloauth.postgres.url=jdbc:postgresql://127.0.0.1:5432/veloauth_it
          -Dveloauth.postgres.user=veloauth_it
          -Dveloauth.postgres.password=veloauth_it_password
          -Dveloauth.database.type=POSTGRESQL
          -Dveloauth.database.url=jdbc:postgresql://127.0.0.1:5432/veloauth_it?sslmode=disable
          -Dveloauth.database.user=veloauth_it
          -Dveloauth.database.password=veloauth_it_password

      - name: Verify MySQL without replacing the candidate JAR
        run: >-
          ./mvnw -B test
          -Dtest=JdbcAuthDaoDatabaseIT,DatabaseMigrationDatabaseIT
          -Dveloauth.database.type=MYSQL
          -Dveloauth.database.url='jdbc:mysql://127.0.0.1:3306/veloauth_it?useSSL=false&serverTimezone=UTC'
          -Dveloauth.database.user=veloauth_it
          -Dveloauth.database.password=veloauth_it_password

      - name: Re-verify candidate bytes after database tests
        env:
          JAR_NAME: ${{ steps.identity.outputs.jar-name }}
        run: >-
          ./scripts/verify-release-candidate.sh --existing
          "${RUNNER_TEMP}/veloauth-release-candidate"
          "${GITHUB_REF_NAME}"

      - name: Attest the exact candidate JAR
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/veloauth-release-candidate/${{ steps.identity.outputs.jar-name }}

      - name: Verify attestation identity before handoff
        env:
          GH_TOKEN: ${{ github.token }}
          JAR_NAME: ${{ steps.identity.outputs.jar-name }}
        run: |
          gh attestation verify "${RUNNER_TEMP}/veloauth-release-candidate/${JAR_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-and-release.yml" \
            --source-ref "${GITHUB_REF}" \
            --source-digest "${GITHUB_SHA}"

      - name: Re-hash the attested candidate before upload
        run: >-
          ./scripts/verify-release-candidate.sh --existing
          "${RUNNER_TEMP}/veloauth-release-candidate"
          "${GITHUB_REF_NAME}"

      - name: Upload the immutable three-file candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/veloauth-release-candidate/${{ steps.identity.outputs.jar-name }}
            ${{ runner.temp }}/veloauth-release-candidate/${{ steps.identity.outputs.jar-name }}.sha256
            ${{ runner.temp }}/veloauth-release-candidate/${{ steps.identity.outputs.jar-name }}.manifest.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  release:
    needs: [candidate, osv-scan]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.candidate.result == 'success' && needs.osv-scan.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Checkout the attested source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Temurin 21.0.12+8 for read-only identity verification
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.12'
          show-download-progress: true

      - name: Download the candidate from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: ${{ runner.temp }}/veloauth-release-candidate

      - name: Enforce canary and operator approval evidence
        env:
          EXTERNAL_CANARY_GREEN: ${{ vars.EXTERNAL_CANARY_GREEN }}
          OPERATOR_RELEASE_SIGNOFF: ${{ vars.OPERATOR_RELEASE_SIGNOFF }}
        run: |
          expected_signoff="${GITHUB_REF_NAME}:${GITHUB_SHA}"
          if [[ "${EXTERNAL_CANARY_GREEN}" != true ]]; then
            echo "Protected environment must set EXTERNAL_CANARY_GREEN=true" >&2
            exit 1
          fi
          if [[ "${OPERATOR_RELEASE_SIGNOFF}" != "${expected_signoff}" ]]; then
            echo "Protected environment must set OPERATOR_RELEASE_SIGNOFF=${expected_signoff}" >&2
            exit 1
          fi

      - name: Verify the downloaded candidate without rebuilding or smoking
        run: >-
          ./scripts/verify-release-candidate.sh --existing
          "${RUNNER_TEMP}/veloauth-release-candidate"
          "${GITHUB_REF_NAME}"

      - name: Verify the exact attestation before publication
        env:
          GH_TOKEN: ${{ github.token }}
          JAR_NAME: ${{ needs.candidate.outputs.jar-name }}
        run: |
          gh attestation verify "${RUNNER_TEMP}/veloauth-release-candidate/${JAR_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build-and-release.yml" \
            --source-ref "${GITHUB_REF}" \
            --source-digest "${GITHUB_SHA}"

      - name: Re-hash the attested candidate before publication
        run: >-
          ./scripts/verify-release-candidate.sh --existing
          "${RUNNER_TEMP}/veloauth-release-candidate"
          "${GITHUB_REF_NAME}"

      - name: Refuse to mutate an existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          response="$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1)"
          status=$?
          set -e
          if [[ ${status} -eq 0 ]]; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists; refusing mutation" >&2
            exit 1
          fi
          if ! grep -Eq '^HTTP/[0-9.]+ 404' <<<"${response}"; then
            printf '%s\n' "${response}" >&2
            echo "Unable to prove that the GitHub release does not exist" >&2
            exit 1
          fi

      - name: Render deterministic release notes
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          notes="${RUNNER_TEMP}/veloauth-release-notes.md"
          ./scripts/verify-release-candidate.sh --render-notes \
            "${GITHUB_WORKSPACE}/.github/RELEASE_TEMPLATE.md" \
            "${GITHUB_WORKSPACE}/CHANGELOG.md" "${notes}" "${VERSION}"
          if grep -Eq '{{[^{}]+}}' "${notes}"; then
            echo "Rendered release notes contain a template placeholder" >&2
            exit 1
          fi

      - name: Publish one versioned release with exactly three assets
        env:
          GH_TOKEN: ${{ github.token }}
          JAR_NAME: ${{ needs.candidate.outputs.jar-name }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          candidate_dir="${RUNNER_TEMP}/veloauth-release-candidate"
          verify_remote_tag_commit() {
            local tag_object tag_type tag_sha depth
            tag_object="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
              --jq '.object.type, .object.sha')"
            tag_type="$(printf '%s\n' "${tag_object}" | sed -n '1p')"
            tag_sha="$(printf '%s\n' "${tag_object}" | sed -n '2p')"
            depth=0
            while [[ "${tag_type}" == tag ]]; do
              depth=$((depth + 1))
              if [[ ${depth} -gt 8 || ! "${tag_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Remote release tag could not be safely peeled" >&2
                exit 1
              fi
              tag_object="$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" \
                --jq '.object.type, .object.sha')"
              tag_type="$(printf '%s\n' "${tag_object}" | sed -n '1p')"
              tag_sha="$(printf '%s\n' "${tag_object}" | sed -n '2p')"
            done
            if [[ "${tag_type}" != commit || "${tag_sha}" != "${GITHUB_SHA}" ]]; then
              echo "Remote release tag does not resolve to workflow commit ${GITHUB_SHA}" >&2
              exit 1
            fi
          }
          verify_remote_tag_commit
          gh release create "${GITHUB_REF_NAME}" \
            "${candidate_dir}/${JAR_NAME}" \
            "${candidate_dir}/${JAR_NAME}.sha256" \
            "${candidate_dir}/${JAR_NAME}.manifest.json" \
            --verify-tag \
            --title "VeloAuth ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/veloauth-release-notes.md" \
            --latest=false

      - name: Verify published assets byte for byte
        env:
          GH_TOKEN: ${{ github.token }}
          JAR_NAME: ${{ needs.candidate.outputs.jar-name }}
        run: |
          verify_remote_tag_commit() {
            local tag_object tag_type tag_sha depth
            tag_object="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
              --jq '.object.type, .object.sha')"
            tag_type="$(printf '%s\n' "${tag_object}" | sed -n '1p')"
            tag_sha="$(printf '%s\n' "${tag_object}" | sed -n '2p')"
            depth=0
            while [[ "${tag_type}" == tag ]]; do
              depth=$((depth + 1))
              if [[ ${depth} -gt 8 || ! "${tag_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Remote release tag could not be safely peeled" >&2
                exit 1
              fi
              tag_object="$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" \
                --jq '.object.type, .object.sha')"
              tag_type="$(printf '%s\n' "${tag_object}" | sed -n '1p')"
              tag_sha="$(printf '%s\n' "${tag_object}" | sed -n '2p')"
            done
            if [[ "${tag_type}" != commit || "${tag_sha}" != "${GITHUB_SHA}" ]]; then
              echo "Remote release tag changed during publication" >&2
              exit 1
            fi
          }
          verify_remote_tag_commit
          # Repository-level immutable releases stay disabled (the rolling job must replace
          # its own assets in place), so practical immutability for this release rests on the
          # refuse-to-mutate gate above, this path never overwriting published assets, and the
          # protected v* tag ruleset — plus the byte-for-byte comparison below.
          actual_assets="$(gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '.assets | map(.name) | sort | .[]')"
          expected_assets="$(printf '%s\n' \
            "${JAR_NAME}" "${JAR_NAME}.manifest.json" "${JAR_NAME}.sha256" | sort)"
          if [[ "${actual_assets}" != "${expected_assets}" ]]; then
            echo "Published release does not contain exactly the three canonical assets" >&2
            printf '%s\n' "${actual_assets}" >&2
            exit 1
          fi
          published_dir="${RUNNER_TEMP}/veloauth-published-release"
          mkdir -p "${published_dir}"
          gh release download "${GITHUB_REF_NAME}" --dir "${published_dir}"
          for asset in "${JAR_NAME}" "${JAR_NAME}.sha256" "${JAR_NAME}.manifest.json"; do
            cmp -- "${RUNNER_TEMP}/veloauth-release-candidate/${asset}" \
              "${published_dir}/${asset}"
          done
          ./scripts/verify-release-candidate.sh --existing \
            "${published_dir}" "${GITHUB_REF_NAME}"
