name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check if there are actual source code changes (excluding docs, workflows, etc.)
  check-changes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    outputs:
      should-release: ${{ steps.changes.outputs.source-changed }}
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 2
        
    - name: Check for source changes
      id: changes
      run: |
        # Check if there are changes in source files (excluding docs, workflows, etc.)
        if git diff --name-only HEAD~1 HEAD | grep -E '\.(java|xml|yml|yaml|json|properties)$' | grep -v -E '\.github/|README\.md|\.gitignore'; then
          echo "source-changed=true" >> "$GITHUB_OUTPUT"
          echo "Source code changes detected - will create release"
        else
          echo "source-changed=false" >> "$GITHUB_OUTPUT"
          echo "No source code changes - skipping release"
        fi

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: veloauth_it
          POSTGRES_USER: veloauth_it
          POSTGRES_PASSWORD: veloauth_it_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veloauth_it -d veloauth_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: veloauth_it
          MYSQL_USER: veloauth_it
          MYSQL_PASSWORD: veloauth_it_password
          MYSQL_ROOT_PASSWORD: veloauth_it_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uveloauth_it -pveloauth_it_password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        
    # Use Maven CLI on GitHub runners
    - name: Prepare Maven
      run: mvn -v

    - name: Verify embedded protocol dependency checksums
      run: ./scripts/verify-embedded-dependencies.sh

    - name: Test latest protocol snapshot resolver with offline fixtures
      run: ./scripts/test-protocol-build-resolver.sh
        
    - name: Build and verify with Maven
      run: mvn -B -V clean verify pmd:cpd-check -DskipTests=false

    - name: Smoke test embedded limbo on a real Velocity proxy
      run: ./scripts/test-velocity-embedded.sh

    - name: Smoke test embedded limbo with Velocity-CTD modern forwarding
      run: ./scripts/test-velocity-ctd-embedded.sh

    - name: Verify AUTH and premium UUID behavior on PostgreSQL
      run: >-
        mvn -B test
        -Dtest=PremiumUuidDaoPostgreSqlIT,JdbcAuthDaoDatabaseIT,DatabaseMigrationDatabaseIT
        -Dveloauth.postgres.url=jdbc:postgresql://127.0.0.1:5432/veloauth_it
        -Dveloauth.postgres.user=veloauth_it
        -Dveloauth.postgres.password=veloauth_it_password
        -Dveloauth.database.type=POSTGRESQL
        -Dveloauth.database.url=jdbc:postgresql://127.0.0.1:5432/veloauth_it?sslmode=disable
        -Dveloauth.database.user=veloauth_it
        -Dveloauth.database.password=veloauth_it_password

    - name: Verify AUTH behavior on MySQL
      run: >-
        mvn -B test
        -Dtest=JdbcAuthDaoDatabaseIT,DatabaseMigrationDatabaseIT
        -Dveloauth.database.type=MYSQL
        -Dveloauth.database.url='jdbc:mysql://127.0.0.1:3306/veloauth_it?useSSL=false&serverTimezone=UTC'
        -Dveloauth.database.user=veloauth_it
        -Dveloauth.database.password=veloauth_it_password
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: veloauth-jar
        path: target/veloauth-*.jar
        retention-days: 30
        
        
  release:
    needs: [check-changes, build]
    runs-on: ubuntu-latest
    # Release on tag pushes always; on main/master pushes only when check-changes
    # detected source changes (doc-only commits skip the release). check-changes is
    # skipped entirely on tag refs, hence !cancelled() instead of the default success().
    if: |
      !cancelled() && needs.build.result == 'success' &&
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/') || needs.check-changes.outputs.should-release == 'true')
    env:
      VERSION: ""
      RELEASE_NAME: ""
      RELEASE_PRERELEASE: "false"
      RELEASE_MAKE_LATEST: "false"
      RELEASE_NOTES: ""
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: veloauth-jar
        path: ./

    - name: Generate release notes
      run: |
        git fetch --tags --prune
        git log -n 10 --pretty=format:'- %h %s (%an)' > release_notes.txt || true
        if [ ! -s release_notes.txt ]; then
          echo "- No recent commits found." > release_notes.txt
        fi
        
    
        
    - name: Create/update latest tag
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        VERSION="latest"
        printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Force update existing latest tag or create new one
        if git rev-parse -q --verify "refs/tags/latest" >/dev/null; then
          git tag -d latest
          git push origin :latest
        fi
        git tag -a "latest" -m "Release latest - $(date +%Y-%m-%d)"
        git push origin "latest"
        
    - name: Set version from tag
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_TAG_NAME: ${{ github.ref_name }}
      run: |
        printf 'VERSION=%s\n' "$RELEASE_TAG_NAME" >> "$GITHUB_ENV"
        
    - name: Rename JAR for release
      run: |
        set -- veloauth-*.jar
        if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
          echo "Expected exactly one VeloAuth JAR, found $#" >&2
          exit 1
        fi
        mv -- "$1" "veloauth-$VERSION.jar"
        
    - name: Prepare release metadata
      run: |
        recent_notes="$(cat release_notes.txt)"
        if [ "$VERSION" = "latest" ]; then
          echo "RELEASE_NAME=Rolling Latest Build" >> "$GITHUB_ENV"
          {
            echo "Rolling release updated on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "Recent changes:"
            echo "$recent_notes"
          } > release_body.txt
          echo "RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
          echo "RELEASE_MAKE_LATEST=true" >> "$GITHUB_ENV"
        else
          printf 'RELEASE_NAME=%s\n' "$VERSION" >> "$GITHUB_ENV"
          {
            echo "Release for tag ${VERSION}."
            echo
            echo "Recent changes:"
            echo "$recent_notes"
          } > release_body.txt
          echo "RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
          echo "RELEASE_MAKE_LATEST=true" >> "$GITHUB_ENV"
        fi

    - name: Publish (update) release
      uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b
      with:
        tag: ${{ env.VERSION }}
        name: ${{ env.RELEASE_NAME }}
        bodyFile: release_body.txt
        allowUpdates: true
        replacesArtifacts: true
        makeLatest: ${{ env.RELEASE_MAKE_LATEST }}
        draft: false
        prerelease: ${{ env.RELEASE_PRERELEASE }}
        artifacts: "veloauth-*.jar"
